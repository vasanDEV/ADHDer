[package]
name = "adhder-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FFI exports for Kotlin / JNI (Android shell)"

[lib]
name = "adhder_android"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
adhder-core = { workspace = true }
adhder-db = { workspace = true }
adhder-tasks = { workspace = true }
adhder-notes = { workspace = true }
adhder-pomodoro = { workspace = true }
adhder-planner = { workspace = true }
adhder-settings = { workspace = true }
adhder-stats = { workspace = true }
adhder-search = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
once_cell = "1"
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
